[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miclustering"
version = "0.1.0"
description = "A Multi-Instance Learning Clustering library"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["multi-instance learning", "clustering", "MIL", "machine learning"]
license = { file = "LICENSE" }
authors = [
  { name="Andres", email="andresmors.jr@gmail.com" },
]
dependencies = [
    "numpy>=1.22.4,<2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "liac-arff>=2.5.0",
    "pandas>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
# Excluir explícitamente el venv y otros directorios de pytest
norecursedirs = [".venv", "venv", ".git", ".tox", "build", "dist", "*.egg"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project.urls]
"Homepage" = "https://github.com/Andmo2004/MIClustering"
"Documentation" = "https://github.com/Andmo2004/MIClustering#readme"

[tool.setuptools.packages.find]
where = ["src"]